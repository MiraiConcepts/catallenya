version: "3.8"

services:
  # Infrastructure & Networking
  tailscale:
    # This needs to be set to 'catallenya' as the certificates generated are associated with this name.
    hostname: catallenya
    container_name: tailscaled
    image: tailscale/tailscale:latest
    restart: unless-stopped
    network_mode: host
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    volumes:
      - /dev/net/tun:/dev/net/tun
      - /zpool/catallenya/tailscale/data:/var/lib/tailscale
      - /zpool/catallenya/tailscale/run:/var/run/tailscale
    command: ["--socket=/var/run/tailscale/tailscaled.sock","--statedir=/var/lib/tailscale","--tun=userspace-networking"]
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
    security_opt:
      - no-new-privileges:true
    labels:
      - com.centurylinklabs.watchtower.enable=true

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    command: tunnel --credentials-file /run/secrets/cloudflared-secret run catallenya-tunnel
    secrets:
      - cloudflared-secret
    environment:
      - TUNNEL_ORIGIN_CERT=/etc/cloudflared/cert.pem
    volumes:
      - /zpool/catallenya/cloudflared/cert.pem:/etc/cloudflared/cert.pem:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    container_name: caddy
    image: caddy:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    depends_on:
      - tailscale
    env_file:
      - .env
    ports:
      - ${GHOST_REVERSE_PROXY_CADDY_PORT}:${GHOST_REVERSE_PROXY_CADDY_PORT}
      - ${FLAME_REVERSE_PROXY_PORT}:${FLAME_REVERSE_PROXY_PORT}
      - ${SYNCTHING_REVERSE_PROXY_PORT}:${SYNCTHING_REVERSE_PROXY_PORT}
      - ${IMMICH_REVERSE_PROXY_PORT}:${IMMICH_REVERSE_PROXY_PORT}
      - ${RADICALE_REVERSE_PROXY_PORT}:${RADICALE_REVERSE_PROXY_PORT}
      - ${NTFY_REVERSE_PROXY_PORT}:${NTFY_REVERSE_PROXY_PORT}
      - ${MEMOS_REVERSE_PROXY_PORT}:${MEMOS_REVERSE_PROXY_PORT}
      - ${ARCHIVEBOX_REVERSE_PROXY_PORT}:${ARCHIVEBOX_REVERSE_PROXY_PORT}
      - ${ISAIAH_REVERSE_PROXY_PORT}:${ISAIAH_REVERSE_PROXY_PORT}
      - ${CATALLENYA_BLOG_REVERSE_PROXY_PORT}:${CATALLENYA_BLOG_REVERSE_PROXY_PORT}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /zpool/catallenya/tailscale/run/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - caddy-data:/data
      - caddy-config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Databases & Cache
  redis:
    container_name: redis
    image: redis:alpine
    restart: unless-stopped
    networks:
      - caddy-internal
    command: redis-server --save "" --appendonly "no"
    tmpfs:
      - /var/lib/redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    labels:
      - com.centurylinklabs.watchtower.enable=true

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    networks:
      - caddy-internal
    secrets:
      - postgres-secret
    environment:
      POSTGRES_HOST: ${DB_HOSTNAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-secret
      POSTGRES_DB: ${DB_DATABASE_NAME}
    volumes:
      - ${DB_VOLUME}:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE

  # Applications
  ghost:
    container_name: ghost
    image: ghost:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    environment:
      - database__client=sqlite3
      - database__connection__filename=/var/lib/ghost/content/data/ghost.db
      - url=${PUBLIC_URL}
    volumes:
      - ${GHOST_VOLUME}:/var/lib/ghost/content
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    labels:
      - flame.type=application
      - flame.name=ghost
      - flame.url=${GHOST_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  flame:
    container_name: flame
    image: pawelmalak/flame:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    volumes:
      - flame-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - password
    environment:
      - PASSWORD_FILE=/run/secrets/password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - com.centurylinklabs.watchtower.enable=true

  syncthing:
    container_name: syncthing
    image: syncthing/syncthing:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${SYNCTHING_VOLUME}:/var/syncthing
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    labels:
      - flame.type=application
      - flame.name=syncthing
      - flame.url=${SYNCTHING_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  radicale:
    container_name: radicale
    image: tomsquest/docker-radicale:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    volumes:
      - ${RADICALE_DATE_VOLUME}:/data
      - ${RADICALE_CONFIG_VOLUME}:/config:ro
    labels:
      - flame.type=application
      - flame.name=radicale
      - flame.url=${RADICALE_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    networks:
      - caddy-internal
    ports:
      - "2283:2283"
    env_file:
      - .env
    volumes:
      - ${IMMICH_VOLUME}:/usr/src/app/upload
    secrets:
      - postgres-secret
    environment:
      DB_PASSWORD_FILE: /run/secrets/postgres-secret
    depends_on:
      - redis
      - database
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    labels:
      - flame.type=application
      - flame.name=immich
      - flame.url=${IMMICH_URL}
      - flame.icon=custom

  immich-machine-learning:
    container_name: immich_machine_learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: unless-stopped
    networks:
      - caddy-internal
    volumes:
      - model-cache:/cache
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy
    restart: unless-stopped
    networks:
      - caddy-internal
    command:
      - serve
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy:/etc/ntfy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    labels:
      - flame.type=application
      - flame.name=ntfy
      - flame.url=${NTFY_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  memos:
    container_name: memos
    image: neosmemo/memos:stable
    restart: unless-stopped
    networks:
      - caddy-internal
    volumes:
      - ${MEMOS_VOLUME}:/var/opt/memos
    environment:
      - MEMOS_MODE=prod
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    labels:
      - flame.type=application
      - flame.name=memos
      - flame.url=${MEMOS_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  archivebox:
    container_name: archivebox
    build:
      context: .
      dockerfile: archivebox.Dockerfile
    restart: unless-stopped
    networks:
      - caddy-internal
    volumes:
      - ${ARCHIVEBOX_VOLUME}:/data
    environment:
      - ALLOWED_HOSTS=catallenya.kamori-mulley.ts.net
      - PUBLIC_INDEX=False
      - PUBLIC_SNAPSHOTS=False
      - PUBLIC_ADD_VIEW=True
      - SEARCH_BACKEND_ENGINE=sonic
      - SEARCH_BACKEND_HOST_NAME=archivebox_sonic
      - SEARCH_BACKEND_PASSWORD=/run/secrets/sonic-secret
      - SAVE_ARCHIVE_DOT_ORG=False
      - MAX_MEDIA_SIZE=5000m
      - TIMEOUT=120
      - CHECK_SSL_VALIDITY=False
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    labels:
      - flame.type=application
      - flame.name=archivebox
      - flame.url=${ARCHIVEBOX_URL}
      - flame.icon=custom

  archivebox_scheduler:
    container_name: archivebox_scheduler
    image: archivebox/archivebox:latest
    restart: unless-stopped
    command: schedule --foreground --update --every=day
    volumes:
      - ${ARCHIVEBOX_VOLUME}:/data
    networks:
      - caddy-internal
    environment:
      - SEARCH_BACKEND_ENGINE=sonic
      - SEARCH_BACKEND_HOST_NAME=archivebox_sonic
      - SEARCH_BACKEND_PASSWORD=/run/secrets/sonic-secret
      - TIMEOUT=120
    secrets:
      - sonic-secret
    depends_on:
      - archivebox
      - archivebox_sonic
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    labels:
      - com.centurylinklabs.watchtower.enable=true

  archivebox_sonic:
    container_name: archivebox_sonic
    image: archivebox/sonic:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    environment:
      - SEARCH_BACKEND_PASSWORD=/run/secrets/sonic-secret
    secrets:
      - sonic-secret
    volumes:
      - ${SONIC_VOLUME}:/var/lib/sonic/store
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Utilities & Monitoring
  isaiah:
    container_name: isaiah
    image: mosswill/isaiah:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - SERVER_PORT=80
      - AUTHENTICATION_ENABLED=False
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      - flame.type=application
      - flame.name=isaiah
      - flame.url=${ISAIAH_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    container_name: watchtower
    image: containrrr/watchtower:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ~/.docker/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${NTFY_PROTOCOL_URL}/${WATCHTOWER_NTFY_TOPIC}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_REMOVE_VOLUMES=true
      - WATCHTOWER_POLL_INTERVAL=3600
      - DOCKER_CONFIG=/
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      - com.centurylinklabs.watchtower.enable=true

  catallenya-blog:
    container_name: catallenya-blog
    image: ghcr.io/carrein/catallenya-blog:latest
    restart: unless-stopped
    networks:
      - caddy-internal
    labels:
      - flame.type=application
      - flame.name=catallenya-blog
      - flame.url=${CATALLENYA_BLOG_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

secrets:
  password:
    file: flame/password.txt
  cloudflared-secret:
    file: cloudflared/token.json
  sonic-secret:
    file: archivebox/password.txt
  postgres-secret:
    file: postgres/password.txt

volumes:
  model-cache:
  ntfy:
  ntfy-cache:
  caddy-data:
  caddy-config:
  flame-data:
networks:
  caddy-internal:
    external: false
