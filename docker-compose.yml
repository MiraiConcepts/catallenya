services:
  memoka:
    container_name: memoka
    image: ghcr.io/carrein/memoka:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 3072M
    environment:
      # Passwords
      SERVERPOD_PASSWORD_database: ${MEMOKA_DB_PASSWORD}
      SERVERPOD_PASSWORD_redis: ${MEMOKA_REDIS_PASSWORD}
      # Public URL configuration (override production.yaml defaults)
      SERVERPOD_apiServer_publicHost: "${TAILNET_DOMAIN}.${TAILNET_DNS_NAME}"
      SERVERPOD_apiServer_publicPort: "${MEMOKA_REVERSE_PROXY_PORT}"
      SERVERPOD_webServer_publicHost: "${TAILNET_DOMAIN}.${TAILNET_DNS_NAME}"
      SERVERPOD_webServer_publicPort: "${MEMOKA_REVERSE_PROXY_PORT}"
    depends_on:
      memoka_postgresql:
        condition: service_healthy
      memoka_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
        - ${MEMOKA_MEDIA_VOLUME}:/app/data/media
    labels:
      - flame.type=application
      - flame.name=Memoka
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  memoka_postgresql:
    container_name: memoka_postgresql
    hostname: postgresql
    # pinned 17.10, 2026-08-10 — floating tag + no watchtower label meant
    # nothing updated it and nothing pinned it, so a `compose pull` could
    # jump a major. Databases stay OFF watchtower deliberately (no semver
    # awareness, and unattended restarts of the data layer). Bump by hand:
    #   docker buildx imagetools inspect pgvector/pgvector:pg17 --format '{{.Manifest.Digest}}'
    image: pgvector/pgvector@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      POSTGRES_USER: memoka_user
      POSTGRES_PASSWORD: ${MEMOKA_DB_PASSWORD}
      POSTGRES_DB: memoka
    volumes:
      - ${MEMOKA_POSTGRES_VOLUME}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoka_user -d memoka"]
      interval: 10s
      timeout: 5s
      retries: 5

  memoka_redis:
    container_name: memoka_redis
    # pinned 7.4.9, 2026-08-10 — floating tag + no watchtower label meant
    # nothing updated it and nothing pinned it, so a `compose pull` could
    # jump a major. Databases stay OFF watchtower deliberately (no semver
    # awareness, and unattended restarts of the data layer). Bump by hand:
    #   docker buildx imagetools inspect redis:7-alpine --format '{{.Manifest.Digest}}'
    image: redis@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      default:
        aliases:
          - redis
    command: redis-server --requirepass ${MEMOKA_REDIS_PASSWORD}
    volumes:
      - ${MEMOKA_REDIS_VOLUME}:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${MEMOKA_REDIS_PASSWORD} ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  tailscale:
    # This needs to be set to 'catallenya' as the certificates generated are associated with this name.
    hostname: catallenya
    container_name: tailscaled
    image: tailscale/tailscale:latest
    restart: unless-stopped
    user: "1000:1000" # Run as host user UID:GID so we can read/write files created by container on shared volumes.
    network_mode: host
    deploy:
      resources:
        limits:
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - NET_BIND_SERVICE
    volumes:
      - /dev/net/tun:/dev/net/tun
      - ${ZPOOL_VOLUME}/tailscale/data:/var/lib
      # Adds volume for the tailscaled.sock so its present on the host system where caddy communicates with tailscale. See: https://github.com/tailscale/tailscale/issues/6849.
      - ${ZPOOL_VOLUME}/tailscale/tmp:/tmp
    environment:
      # Persist the state in host and survives container reboot. See: https://github.com/tailscale/tailscale/issues/4913#issuecomment-1186402307.
      - TS_STATE_DIR=/var/lib/tailscale
      # Use TS_AUTH_KEY on initial boot. This key will be persisted in var/lib/tailscale and can be removed on subsequent runs.
    healthcheck:
      test: ["CMD-SHELL", "test -S /tmp/tailscaled.sock"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
    command: tunnel --credentials-file /run/secrets/cloudflared-secret run catallenya-tunnel
    secrets:
      - cloudflared-secret
    labels:
      - com.centurylinklabs.watchtower.enable=true

  caddy:
    container_name: caddy
    image: caddy:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          memory: 128M
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      TAILNET_DOMAIN: ${TAILNET_DOMAIN}
      TAILNET_DNS_NAME: ${TAILNET_DNS_NAME}
      FLAME_REVERSE_PROXY_PORT: ${FLAME_REVERSE_PROXY_PORT}
      SYNCTHING_REVERSE_PROXY_PORT: ${SYNCTHING_REVERSE_PROXY_PORT}
      IMMICH_REVERSE_PROXY_PORT: ${IMMICH_REVERSE_PROXY_PORT}
      RADICALE_REVERSE_PROXY_PORT: ${RADICALE_REVERSE_PROXY_PORT}
      NTFY_REVERSE_PROXY_PORT: ${NTFY_REVERSE_PROXY_PORT}
      ARCHIVEBOX_REVERSE_PROXY_PORT: ${ARCHIVEBOX_REVERSE_PROXY_PORT}
      MEMOKA_REVERSE_PROXY_PORT: ${MEMOKA_REVERSE_PROXY_PORT}
      CHANGEDETECTION_REVERSE_PROXY_PORT: ${CHANGEDETECTION_REVERSE_PROXY_PORT}
      IPP_REVERSE_PROXY_PORT: ${IPP_REVERSE_PROXY_PORT}
      MITSUME_REVERSE_PROXY_PORT: ${MITSUME_REVERSE_PROXY_PORT}
      AFTERIMAGE_REVERSE_PROXY_PORT: ${AFTERIMAGE_REVERSE_PROXY_PORT}
      PIGEONHOLE_REVERSE_PROXY_PORT: ${PIGEONHOLE_REVERSE_PROXY_PORT}
      MITSUME_DAV_B64: ${MITSUME_DAV_B64}
    ports:
      # All host publishes bound to 127.0.0.1: tailnet reaches caddy via the
      # userspace-tailscaled→127.0.0.1 forward, so loopback still serves the
      # tailnet while the home LAN (enp3s0) gets no listener. See memory
      # tailscale-userspace-loopback-forwarding.
      - 127.0.0.1:${FLAME_REVERSE_PROXY_PORT}:${FLAME_REVERSE_PROXY_PORT}
      - 127.0.0.1:${SYNCTHING_REVERSE_PROXY_PORT}:${SYNCTHING_REVERSE_PROXY_PORT}
      - 127.0.0.1:${IMMICH_REVERSE_PROXY_PORT}:${IMMICH_REVERSE_PROXY_PORT}
      - 127.0.0.1:${RADICALE_REVERSE_PROXY_PORT}:${RADICALE_REVERSE_PROXY_PORT}
      - 127.0.0.1:${NTFY_REVERSE_PROXY_PORT}:${NTFY_REVERSE_PROXY_PORT}
      - 127.0.0.1:${ARCHIVEBOX_REVERSE_PROXY_PORT}:${ARCHIVEBOX_REVERSE_PROXY_PORT}
      - 127.0.0.1:${MEMOKA_REVERSE_PROXY_PORT}:${MEMOKA_REVERSE_PROXY_PORT}  # API server port
      - 127.0.0.1:${CHANGEDETECTION_REVERSE_PROXY_PORT}:${CHANGEDETECTION_REVERSE_PROXY_PORT}
      - 127.0.0.1:${IPP_REVERSE_PROXY_PORT}:${IPP_REVERSE_PROXY_PORT}
      - 127.0.0.1:${MITSUME_REVERSE_PROXY_PORT}:${MITSUME_REVERSE_PROXY_PORT}
      - 127.0.0.1:${AFTERIMAGE_REVERSE_PROXY_PORT}:${AFTERIMAGE_REVERSE_PROXY_PORT}
      - 127.0.0.1:${PIGEONHOLE_REVERSE_PROXY_PORT}:${PIGEONHOLE_REVERSE_PROXY_PORT}
    volumes:
      - ${ZPOOL_VOLUME}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ZPOOL_VOLUME}/caddy/flags:/flags:ro
      - ${ZPOOL_VOLUME}/tailscale/tmp:/var/run/tailscale:ro
      - caddy-data:/data # Persistent volume for certificates.
      - caddy-config:/config # Persistent volume for config cache.
    healthcheck:
      # Caddy is the single front door for every tailnet service AND the public
      # blog, but catallenya.sh only verifies containers reach `running` — a Caddy
      # holding a broken config stays `running` forever and boot still reports
      # green. The admin API answers on 2019 inside the container only (never
      # published); the image ships wget. Verified 200 before adding this.
      test: ["CMD", "wget", "-q", "--spider", "--timeout=5", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  immich-server:
    container_name: immich-server
    image: ghcr.io/immich-app/immich-server:release
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
                    # 2G could not hold node plus a jellyfin-ffmpeg transcode: OOM-killed
          # 2026-08-07 09:08 (the killer task was a mov,mp4 demuxer thread) and the
          # container restarted under us. Sits at ~909 MiB idle; the ceiling is for
          # transcode spikes, and the host has 30 GiB with ~3.7 GiB in use.
          memory: 4G
    # No host publish. Caddy reaches this over the compose network on
    # immich-server:2283 (Caddyfile:89) and serves it on :9000 WITH
    # security_headers. The old publish was a second, undocumented,
    # header-less path to the same app reachable from every tailnet node,
    # and appears in no port table. Confirmed the Immich client uses :9000.
    volumes:
      - ${IMMICH_VOLUME}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - postgres-secret
    environment:
      DB_HOSTNAME: ${DB_HOSTNAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_DATABASE_NAME: ${DB_DATABASE_NAME}
      DB_PASSWORD_FILE: /run/secrets/postgres-secret
      REDIS_HOSTNAME: immich_redis
    depends_on:
      - immich_redis
      - postgres
    healthcheck:
      disable: false
    labels:
      - flame.type=application
      - flame.name=immich
      - flame.url=${IMMICH_URL}
      - flame.icon=custom

  immich-machine-learning:
    container_name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2G
    volumes:
      - model-cache:/cache
    healthcheck:
      disable: false

  immich_redis:
    container_name: immich-redis
    image: docker.io/valkey/valkey:8@sha256:81db6d39e1bba3b3ff32bd3a1b19a6d69690f94a3954ec131277b9a26b95b3aa
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          # Immich v3 integrity checks enqueue ~2MB BullMQ jobs (10k file
          # entries per payload); a 609k-asset run needs ~200MB peak. 64M
          # caused a valkey OOM-kill loop on 2026-07-02 (see git history).
          memory: 512M
    healthcheck:
      test: redis-cli ping || exit 1
    # No watchtower label: image is digest-pinned (matching upstream Immich's
    # compose), so watchtower could never move it anyway. Bump the digest
    # manually alongside Immich updates.

  postgres:
    container_name: immich-postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 2048M
    secrets:
      - postgres-secret
    environment:
      POSTGRES_HOST: ${DB_HOSTNAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-secret
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_VOLUME}:/var/lib/postgresql/data
    shm_size: 512mb

  immich-public-proxy:
    container_name: immich-public-proxy
    # Public gallery surface in front of the PRIVATE Immich: serves only
    # publicly-shared albums (authenticated per album by its share key), so the
    # blog never touches Immich's /api or /share. Docker Hub, version-pinned —
    # GHCR has no clean semver release tags; 3.0.1 is the current stable release
    # (v3.x adds Immich v3 support and stays compatible with Immich 2.x).
    image: alangrainger/immich-public-proxy:3.0.1
    restart: unless-stopped
    user: "1000:1000" # Matches the image's built-in "node" user (UID 1000) and the stack convention.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true # Stateless proxy; only writes to /tmp (verified to boot read-only).
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 128M
    environment:
      # PRIVATE internal address — must NEVER be public. IPP needs no Immich API
      # key; it authenticates to shared albums with each album's public share key.
      - IMMICH_URL=http://immich-server:2283
      # Public base URL IPP advertises (OG/canonical tags). Reached publicly via the
      # catallenya-tunnel → Caddy http://img.catallenya.com block. Item image URLs in
      # the #ipp-init island are relative, so consumers prepend this base themselves.
      - PUBLIC_BASE_URL=${IPP_PUBLIC_BASE_URL}
      - IPP_PORT=3000
    volumes:
      - ${ZPOOL_VOLUME}/immich-public-proxy/config.json:/app/config.json:ro
    depends_on:
      immich-server:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/healthcheck || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # Intentionally NO watchtower label: the blog parses IPP's internal JSON
    # data-island (#ipp-init), so IPP is version-pinned and bumped deliberately
    # in lockstep with the blog's parser.

  # DEPRECATED 2026-08-09 — not started by `docker compose up -d`.
  #
  # Flame authenticates with `process.env.PASSWORD` ONLY (controllers/auth/login.js:11).
  # It has no support for PASSWORD_FILE, so the `secrets: [password]` + PASSWORD_FILE
  # below were dead config and the effective admin password was the image's published
  # default `flame_password` (confirmed by sha256 against the running container's env).
  # Combined with PID 1 running as root and a working /var/run/docker.sock (`:ro`
  # restricts the bind, NOT the API — GET /containers/json returned 200 from inside),
  # any tailnet device could reach :4000, log in with a password published in Flame's
  # own Dockerfile, and create a container with a `/` bind = root on the host.
  # The tailnet ACL is `{"src":["*"],"dst":["*:*"]}`, so that meant every peer.
  #
  # Left defined rather than deleted: flame/data/ is preserved and is in restic.
  # To bring it back:  docker compose --profile deprecated up -d flame
  # BEFORE re-enabling, fix both halves: replace PASSWORD_FILE with a real
  # PASSWORD env var, and drop the docker.sock mount (entries are static in
  # flame/data/config.json, so the socket buys nothing).
  flame:
    profiles: ["deprecated"]
    container_name: flame
    image: pawelmalak/flame:latest
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - ${FLAME_VOLUME}:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    secrets:
      - password
    environment:
      - PASSWORD_FILE=/run/secrets/password
    labels:
      - com.centurylinklabs.watchtower.enable=true

  syncthing:
    container_name: syncthing
    image: syncthing/syncthing:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
                    # 512M was OOM-killing this 26 times (25 in June, once 2026-08-05).
          # Syncthing v2 carries a SQLite backend and is heavier than v1. Its own
          # supervisor respawns the killed worker, so RestartCount stayed 0 and the
          # healthcheck read healthy while a sync had been cut mid-flight — and this
          # is the ingest path the documents pipeline reads from. Sits at ~188 MiB.
          memory: 1G
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ${SYNCTHING_VOLUME}:/var/syncthing
    labels:
      - flame.type=application
      - flame.name=syncthing
      - flame.url=${SYNCTHING_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  radicale:
    container_name: radicale
    image: tomsquest/docker-radicale:latest
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - CHOWN
      - KILL
    deploy:
      resources:
        limits:
          memory: 256M
          pids: 50
    volumes:
      - ${RADICALE_DATE_VOLUME}:/data
      - ${RADICALE_CONFIG_VOLUME}:/config:ro
    labels:
      - flame.type=application
      - flame.name=radicale
      - flame.url=${RADICALE_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  afterimage:
    container_name: afterimage
    # Built locally: the source lives in this repo (afterimage/src), unlike the
    # carrein apps which ship prebuilt from GHCR. Same reason archivebox builds.
    build:
      context: ./afterimage
    restart: unless-stopped
    user: "1000:1000" # writes the spool, which is host-owned 1000:1000
    # The image now sets USER bun itself, so this is belt-and-braces rather than
    # the only thing keeping the process off root.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # Bun buffers the whole request body before the size check can run, at
          # roughly 2.3x the body in RSS. At 128M a single ~48MB POST from inside
          # the compose network OOM-killed the container; 15MB uploads now have
          # headroom for several concurrent. Caddy caps external requests at 16MB,
          # but container-to-container traffic never passes through Caddy.
          memory: 384M
    environment:
      # Calendar collection IDs. Literals, not .env vars: they are stack-defining
      # constants like `reverse_proxy radicale:5232`, not secrets.
      CAL_GENERAL: ac0fbe63-a775-4603-97cb-03020b239ae3 # carrein-calendar
      CAL_BIRTHDAY: 28acf882-0a72-5d71-b645-5b6e1a7f8ca1 # carrein-birthday
      # The ONE browser origin allowed to satisfy the X-Capture preflight. The ntfy
      # web UI taps buttons via browser fetch, so CORS applies to it; the phone app
      # does native HTTP and never sees this. Any other page is still refused.
      NTFY_ORIGIN: https://${TAILNET_DOMAIN}.${TAILNET_DNS_NAME}:${NTFY_REVERSE_PROXY_PORT}
      # Where this container sends the DELETE that withdraws a notification on a tap.
      # Container-to-container and plain HTTP, exactly like radicale above — no TLS,
      # no tailnet round trip, and ntfy is unauthenticated on this network anyway, so
      # this adds a destination rather than a privilege. Hardcoded rather than
      # interpolated from .env: nothing about it is environment-specific. Unset it
      # to fall back to the nightly sweep clearing notifications instead.
      #
      # An interpolation-shaped example in a WHOLE-LINE comment is now safe: the CI
      # drift guard strips those before grepping (fixed 2026-08-10, after prose
      # describing an interpolation read as one and broke this build). Still avoid
      # it in a TRAILING comment on a config line — the guard cannot strip those
      # without corrupting values that legitimately contain a `#`.
      NTFY_URL: http://ntfy
      NTFY_TOPIC: capture
    # The Radicale password comes in as a file, not an env var: `docker inspect`
    # and /proc/1/environ both expose environment, and this credential is good for
    # read/write/delete across the whole /carrein/ tree. Same pattern as immich's
    # DB_PASSWORD_FILE. The value is identical to the MITSUME_DAV_B64 Caddy injects.
    secrets:
      - afterimage-dav-secret
    volumes:
      # Shared with the host triage (afterimage.triage.service) — this bind IS the
      # interface between the container and the AI half of the pipeline.
      - ${ZPOOL_VOLUME}/afterimage/data:/data
    # No ports: reached only through Caddy, like every other app container.
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'process.exit((await fetch(\"http://127.0.0.1:8080/healthz\")).ok ? 0 : 1)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No watchtower label: locally built, so there is no upstream image to poll.

  pigeonhole-approve:
    container_name: pigeonhole-approve
    # Built locally, same reasoning as capture: the source lives in this repo.
    build:
      context: ./pigeonhole/approve
    restart: unless-stopped
    user: "1000:1000" # writes markers into a host-owned 1000:1000 directory
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # Every request is an empty POST and the response is three fields. This
          # is orders of magnitude more than needed and still small enough that a
          # runaway is capped rather than eating the box.
          memory: 128M
    environment:
      # The ONE browser origin allowed to satisfy the X-Documents preflight — the
      # ntfy web UI, which taps buttons via browser fetch. The phone app does native
      # HTTP and never sees this. Any other page is refused.
      NTFY_ORIGIN: https://${TAILNET_DOMAIN}.${TAILNET_DNS_NAME}:${NTFY_REVERSE_PROXY_PORT}
    volumes:
      # THE ONLY MOUNT, AND THE WHOLE SECURITY ARGUMENT. This container can write
      # zero-byte markers into one directory and nothing else — master/documents is
      # not visible to it at any path. The move is done by pigeonhole.apply.service,
      # a hardened oneshot that is never reachable from the network.
      #
      # Do NOT add a mount here. If a future change seems to need one, it belongs in
      # the apply script instead; the reason this service is safe to expose on the
      # tailnet behind an unauthenticated ntfy topic is that there is nothing here
      # to reach.
      - ${ZPOOL_VOLUME}/pigeonhole/intake-state/approvals:/approvals
    # No ports: reached only through Caddy, like every other app container.
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'process.exit((await fetch(\"http://127.0.0.1:8080/healthz\")).ok ? 0 : 1)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No watchtower label: locally built, so there is no upstream image to poll.

  # The liquidroom JOB image — request marker -> Soulseek download -> stems
  # (see liquidroom/README.md). NOT a service in the resident sense: `profiles:`
  # keeps it out of boot's `up -d`, and it only exists for the minutes a
  # `docker compose run --rm` from liquidroom.triage.service lasts. ONE image,
  # TWO entries, differing only in network policy — download needs the internet,
  # the AI stages need none at all.
  liquidroom:
    # Built locally, same reasoning as capture: the source lives in this repo.
    build:
      context: ./liquidroom
    image: catallenya-liquidroom
    profiles: ["liquidroom"]
    restart: "no" # a job, not a daemon — the triage script owns its lifecycle
    user: "1000:1000" # writes the spool, which is host-owned 1000:1000
    read_only: true
    tmpfs:
      - /tmp # HOME for the run; the sockseek conf (credentials) renders here and dies with it
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # Provisional until the benchmark (deploy step): torch inference peaks
          # a few GB; 10G caps a runaway well below the box's 30G. First job-image
          # memory bound in this file — resident services run far smaller.
          memory: 10G
          pids: 256
    # Its OWN network, never the shared default bridge: this container talks to
    # arbitrary Soulseek peers on the internet, and nothing it could be made to
    # do should reach postgres/radicale/ntfy on the flat network the other 26
    # containers share.
    networks:
      - liquidroom
    # Soulseek peer-listen port. NOT published by a plain `compose run` — only
    # the download stage passes --service-ports, so the separation stage (and
    # anything else) exposes nothing. ACCEPTED transient exposure: during a
    # download this binds 50300 on 0.0.0.0 (reachable from LAN/tailnet), a
    # deliberate exception to the "only SSH:22 is non-loopback" posture — an
    # inbound port is what lets passive Soulseek peers connect. The listener is
    # sockseek only, on the isolated bridge, cap_drop ALL + read_only, and gone
    # the moment the download ends.
    ports:
      - "50300:50300"
    volumes:
      - ${ZPOOL_VOLUME}/liquidroom/state/work:/work
      - ${ZPOOL_VOLUME}/liquidroom/state/models:/models
    # No watchtower label: locally built, so there is no upstream image to poll.
    # Rebuilds are manual: docker compose build liquidroom

  # The same image with NO network whatsoever: separation, the lead/rhythm split
  # and the mixes read /work and /models and talk to nobody. The split model is a
  # community checkpoint (sha256-pinned in liquidroom/scripts/models.sh); running
  # it disconnected means even a malicious pickle has nowhere to phone home.
  liquidroom-offline:
    image: catallenya-liquidroom
    profiles: ["liquidroom"]
    restart: "no"
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 10G
          pids: 256
    network_mode: none
    volumes:
      - ${ZPOOL_VOLUME}/liquidroom/state/work:/work
      - ${ZPOOL_VOLUME}/liquidroom/state/models:/models

  mitsume:
    container_name: mitsume
    image: ghcr.io/carrein/mitsume:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # in-container Caddy binds :80
    deploy:
      resources:
        limits:
          memory: 64M
    labels:
      - flame.type=application
      - flame.name=mitsume
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  ntfy:
    container_name: ntfy
    image: binwiederhier/ntfy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 128M
    command:
      - serve
    environment:
      - TZ=Asia/Singapore
      # Attachments needed for clients (e.g. changedetection.io) that upload
      # diff files alongside notifications. Cache dir lives inside the existing
      # ntfy-cache volume. NTFY_BASE_URL must be set or attachment endpoints
      # 400 with "attachments not allowed".
      - NTFY_ATTACHMENT_CACHE_DIR=/var/cache/ntfy/attachments
      - NTFY_BASE_URL=${NTFY_URL}
      # Bodies over the size limit get auto-converted to attachments with a
      # mime-sniffed name (seen as "attachment.csv" from a watchtower warning
      # batch). 16K keeps verbose log batches inline. Self-hosted only — no
      # Firebase/APNS in play, so exceeding the upstream 4K default is safe.
      - NTFY_MESSAGE_SIZE_LIMIT=16384
      # 72h, up from the 12h default (2026-08-09). This is how long the server
      # holds a message for a client that reconnects and asks for what it missed,
      # and the capture/documents pipelines now rely on it for more than replay:
      # they withdraw a stale notification by publishing a message_delete event,
      # which is cached like any other message. A phone offline longer than this
      # window misses the deletion and keeps a notification for a record that has
      # already been archived or binned. 12h was narrower than a weekend away.
      - NTFY_CACHE_DURATION=72h
      # Without a cache FILE the cache is in-memory only, so the 72h above
      # survived nothing: every ntfy restart dropped all of it. Watchtower polls
      # hourly and recreates this container on any image update, so those
      # restarts are unscheduled. That took the retract/withdraw mechanism with
      # it — a message_delete event is cached like any other message, so a phone
      # reconnecting after a restart would never see the deletion and would keep
      # a notification for a record already archived or binned. The ntfy-cache
      # volume mounted at /var/cache/ntfy already persists; this puts the cache
      # in it. Duration and file are two halves of one setting.
      - NTFY_CACHE_FILE=/var/cache/ntfy/cache.db
    volumes:
      - ntfy-cache:/var/cache/ntfy
      - ntfy:/etc/ntfy
    labels:
      - flame.type=application
      - flame.name=ntfy
      - flame.url=${NTFY_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  archivebox:
    container_name: archivebox
    build:
      context: .
      dockerfile: archivebox.Dockerfile # Custom Dockerfile for ArchiveBox.
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 2G # Archiving spawns headless Chromium (singlefile/screenshot/pdf/dom); 256M OOM-killed mid-archive.
    shm_size: 1gb # Chrome uses /dev/shm heavily; the 64M default crashes the renderer on heavy pages.
    volumes:
      - ${ARCHIVEBOX_VOLUME}:/data
    environment:
      - ALLOWED_HOSTS=${TAILNET_DOMAIN}.${TAILNET_DNS_NAME}
      - PUBLIC_INDEX=False # Disable public listing.
      - PUBLIC_SNAPSHOTS=False # Disable public snapshot access.
      - PUBLIC_ADD_VIEW=True # Enable anonymous link submissions.
      - SEARCH_BACKEND_ENGINE=sonic # Search backend (uses Sonic container below).
      - SEARCH_BACKEND_HOST_NAME=archivebox_sonic
      - SEARCH_BACKEND_PASSWORD=/run/secrets/sonic-secret
      - SAVE_ARCHIVE_DOT_ORG=False # Don't submit to archive.org.
      - MAX_MEDIA_SIZE=5000m # Allow up to 5 GB media (YouTube videos, etc.).
      - TIMEOUT=120 # Allow slow pages up to 120s.
      - CHECK_SSL_VALIDITY=False
    labels:
      - flame.type=application
      - flame.name=archivebox
      - flame.url=${ARCHIVEBOX_URL}
      - flame.icon=custom
    # No Watchtower pull as we use a local Dockerfile instead of a registry reference.

  archivebox_scheduler:
    container_name: archivebox_scheduler
    image: archivebox/archivebox:latest
    restart: unless-stopped
    # NO no-new-privileges: `crontab` is setuid and archivebox_schedule.py calls
    # CronTab(user=True) at startup. Under NNP that read fails with
    #   OSError: Read crontab archivebox: crontabs/archivebox/: fopen: Permission denied
    # and the container crash-loops. Tried and reverted 2026-08-10. The main
    # archivebox service shares this image, so it is left unhardened too.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
    command: schedule --foreground --update --every=day
    volumes:
      - ${ARCHIVEBOX_VOLUME}:/data
    environment:
      - SEARCH_BACKEND_ENGINE=sonic
      - SEARCH_BACKEND_HOST_NAME=archivebox_sonic
      - SEARCH_BACKEND_PASSWORD=/run/secrets/sonic-secret
      - TIMEOUT=120
    secrets:
      - sonic-secret
    depends_on:
      - archivebox
      - archivebox_sonic
    # No watchtower label: the main archivebox container is built from a local
    # Dockerfile, so auto-updating the scheduler would let a newer ArchiveBox
    # migrate the shared index.sqlite3 ahead of it. Pull a matching image when
    # rebuilding archivebox instead.

  archivebox_sonic:
    container_name: archivebox_sonic
    image: archivebox/sonic:latest
    restart: unless-stopped
    user: "1000:1000" # Match store ownership; root + cap_drop ALL (no DAC_OVERRIDE) can't write the 1000-owned KV dir.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      - SEARCH_BACKEND_PASSWORD=/run/secrets/sonic-secret
    secrets:
      - sonic-secret
    volumes:
      - ${SONIC_VOLUME}:/var/lib/sonic/store
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    container_name: watchtower
    image: nickfedor/watchtower:latest
    restart: unless-stopped
    # Note: No cap_drop/security_opt — Watchtower needs full Docker socket
    # access for self-update and container lifecycle management. Hardening
    # breaks its self-update pull and prevents scanning other containers.
    # That exemption is about CAPABILITIES though; a memory ceiling does not
    # touch the socket, and every other service in this file has one. Idles
    # at ~14 MB, so 128M is headroom rather than a constraint.
    deploy:
      resources:
        limits:
          memory: 128M
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${ZPOOL_VOLUME}/watchtower/config.json:/config.json:ro
    environment:
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_NOTIFICATIONS=shoutrrr
      - WATCHTOWER_NOTIFICATION_URL=${NTFY_PROTOCOL_URL}/${WATCHTOWER_NTFY_TOPIC}
      - WATCHTOWER_CLEANUP=true
      # WATCHTOWER_REMOVE_VOLUMES removed 2026-08-10. It deletes a container's
      # ANONYMOUS volumes on update. Safe today only by accident: every
      # watchtower-labelled service (radicale, syncthing, upvotes) happens to
      # have its image's VOLUME paths covered by a bind mount, so no anonymous
      # volume exists to delete. Label a service whose VOLUME is not bind-covered
      # and the next auto-update silently discards its state. CLEANUP=true above
      # already reclaims the old IMAGES, which is what this was reached for.
      - WATCHTOWER_POLL_INTERVAL=3600
    labels:
      - com.centurylinklabs.watchtower.enable=true

  carrein-blog:
    container_name: carrein-blog
    image: ghcr.io/carrein/carrein-blog:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          memory: 128M
    labels:
      - flame.type=application
      - flame.name=carrein-blog
      - flame.url=${CARREIN_BLOG_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  upvotes:
    container_name: upvotes
    image: ghcr.io/carrein/upvotes:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 64M
    environment:
      # Locks POST/DELETE to requests from this origin (server-side Origin allowlist).
      ALLOWED_ORIGINS: https://catallenya.com
    volumes:
      - ${ZPOOL_VOLUME}/upvotes/data:/data
      - ${ZPOOL_VOLUME}/upvotes/dump:/dump
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'process.exit((await fetch(\"http://127.0.0.1:8080/healthcheck\")).ok ? 0 : 1)' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - com.centurylinklabs.watchtower.enable=true

  zipline_postgresql:
    container_name: zipline-postgres
    # pinned 16.14, 2026-08-10 — floating tag + no watchtower label meant
    # nothing updated it and nothing pinned it, so a `compose pull` could
    # jump a major. Databases stay OFF watchtower deliberately (no semver
    # awareness, and unattended restarts of the data layer). Bump by hand:
    #   docker buildx imagetools inspect postgres:16 --format '{{.Manifest.Digest}}'
    image: postgres@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 256M
    environment:
      POSTGRES_USER: ${POSTGRESQL_USER}
      POSTGRES_DB: ${POSTGRESQL_DB}
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
    volumes:
      - ${POSTGRESQL_VOLUME}:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'zipline']
      interval: 10s
      timeout: 5s
      retries: 5

  zipline:
    container_name: zipline
    image: ghcr.io/diced/zipline:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512M
    environment:
      - DATABASE_URL=postgres://${POSTGRESQL_USER}:${POSTGRESQL_PASSWORD}@zipline_postgresql:5432/${POSTGRESQL_DB}
      - CORE_SECRET=${ZIPLINE_CORE_SECRET}
    depends_on:
      zipline_postgresql:
        condition: service_healthy
    volumes:
      - ${ZIPLINE_VOLUME}/uploads:/zipline/uploads
      - ${ZIPLINE_VOLUME}/public:/zipline/public
      - ${ZIPLINE_VOLUME}/themes:/zipline/themes
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:3000/api/healthcheck']
      interval: 15s
      timeout: 2s
      retries: 2
    labels:
      - flame.type=application
      - flame.name=zipline
      - flame.url=${ZIPLINE_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

  changedetection:
    container_name: changedetection
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Image runs as root with no USER directive. cap_drop ALL strips
    # DAC_OVERRIDE, so root can't write to the carrein-owned /datastore
    # bind mount. Restore the filesystem caps it needs (same pattern as
    # memoka_postgresql) rather than chown'ing the host dir to root.
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
    deploy:
      resources:
        limits:
          memory: 1G
    # No PLAYWRIGHT_DRIVER_URL / changedetection-browser companion: the last watch
    # needing the html_webdriver backend was retired 2026-08-02, leaving a Chromium
    # with cap_add SYS_ADMIN idling at ~300M for no consumer. Every remaining watch
    # is a plain html_requests fetch of a Shopify JSON endpoint. To restore JS
    # rendering, re-add the sockpuppetbrowser service (dgtlmoon/sockpuppetbrowser,
    # SYS_ADMIN + shm_size 2gb) plus this env var and a depends_on; git history has
    # the block. Watches set to html_webdriver will error until that is done.
    environment:
      - BASE_URL=${CHANGEDETECTION_URL}
      - TZ=Asia/Singapore
      # The UI was previously unauthenticated: / and /settings both returned 200 to
      # anyone on the tailnet, and /settings displays the API key and the Apprise
      # notification URLs. Adding a watch is an arbitrary server-side fetch from a
      # container running as root with CHOWN/FOWNER/DAC_OVERRIDE on the flat bridge,
      # so an open UI is an SSRF console against every internal service.
      #
      # SALTED_PASS takes precedence over datastore.settings.application.password
      # (flask_app.py:442-445), so auth lives in compose rather than in the JSON —
      # nothing to lose on a datastore edit, and it is version-controlled.
      # Format is base64(salt[32] || pbkdf2_hmac('sha256', pw, salt, 100000)).
      # The REST API is gated separately by x-api-key and is unaffected, so
      # ntfy/changedetection-ntfy.sh keeps working.
      - SALTED_PASS=${CHANGEDETECTION_SALTED_PASS}
    volumes:
      - ${CHANGEDETECTION_VOLUME}:/datastore
    healthcheck:
      test: ["CMD-SHELL", "timeout 10 bash -c ':>/dev/tcp/127.0.0.1/5000'"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
    labels:
      - flame.type=application
      - flame.name=changedetection
      - flame.url=${CHANGEDETECTION_URL}
      - flame.icon=custom
      - com.centurylinklabs.watchtower.enable=true

secrets:
  password: # Flame hardcodes the password field.
    file: flame/password.txt
  cloudflared-secret:
    file: cloudflared/token.json
  sonic-secret:
    file: archivebox/password.txt
  postgres-secret:
    file: postgres/password.txt
  afterimage-dav-secret: # base64(carrein:<radicale app pw>) — same value as MITSUME_DAV_B64
    file: afterimage/dav-secret

volumes:
  model-cache:
  ntfy:
  ntfy-cache:
  caddy-data:
  caddy-config:

networks:
  # The liquidroom downloader's private bridge — internet access without a path
  # to the 26 containers on the shared default network. First (and so far only)
  # named network in this file; everything else deliberately stays on the flat
  # bridge per the standing decision in CLAUDE.md.
  liquidroom:
    driver: bridge
