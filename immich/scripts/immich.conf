# Shared config for immich/scripts/*.sh
# Sourced by immich.lib.sh — do NOT execute directly.

# Base URL for the Immich API. Localhost port is bound by docker-compose
# (see immich-server: 127.0.0.1:2283:2283), so this works from the host
# without going through Caddy or Tailscale.
IMMICH_API_URL="${IMMICH_API_URL:-http://127.0.0.1:2283}"

# API key resolution order:
#   1. $IMMICH_API_KEY environment variable (if set)
#   2. File at $IMMICH_API_KEY_FILE (default: immich/scripts/.immich_api_key)
# Generate a key at: Immich UI → Account Settings → API Keys.
IMMICH_API_KEY_FILE="${IMMICH_API_KEY_FILE:-$(dirname "${BASH_SOURCE[0]}")/.immich_api_key}"

# Default HTTP timeout in seconds for individual API calls.
IMMICH_HTTP_TIMEOUT="${IMMICH_HTTP_TIMEOUT:-10}"
