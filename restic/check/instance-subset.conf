# Instance sticker for restic.check@subset.service.
#
# Linked by install.sh into restic.check@subset.service.d/40-instance.conf.
# Instance drop-ins are searched BEFORE the template's own .d/, so these values win.
#
# This file exists because systemd ignores the [X-Catallenya] section entirely,
# which means %i is never expanded inside it — a template cannot carry per-instance
# metadata. The two instances run a month and a year apart, so one shared MaxAge
# would either miss eleven skipped subset checks or cry wolf about the yearly one.

[X-Catallenya]
# Monthly, 1st at 03:00 with an hour of jitter. 40d allows one missed month.
MaxAge=40d
# No artifact: `check` is read-only by design and leaves nothing behind. A clean
# check and a check that never ran are indistinguishable from outside.
Freshness=stamp:/zpool/catallenya/systemd/state/restic.check@subset
