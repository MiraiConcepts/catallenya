# Instance sticker for restic.check@data.service.
#
# Linked by install.sh into restic.check@data.service.d/40-instance.conf.
# See instance-subset.conf for why a template cannot carry these values.

[X-Catallenya]
# Yearly, second Tuesday of May at 05:00 with an hour of jitter. 400d allows the
# schedule to drift by a few weeks — which it does, since "second Tuesday" moves —
# without a missed year going unnoticed.
#
# A year is a long time to wait to learn this stopped running, but the alternative
# is a false alarm every year between the anniversary and the actual run. The
# monthly subset check covers the same repository structurally in the meantime;
# only the full read of pack data is unique to this instance.
MaxAge=400d
Freshness=stamp:/zpool/catallenya/systemd/state/restic.check@data
