RESTIC_DRIVER=rclone
RESTIC_RCLONE_REMOTE=backblaze
RESTIC_BACKUP_LOCATION=catallenya-b2
# Deliberately OFF the pool. A full restore is 1.549 TiB (measured 2026-08-09)
# against 1.76T free, so restoring into /zpool/restored fits by only ~210 GiB,
# pushes the pool past the 75% disk.timer alert, and — because /zpool is a single
# dataset — the restored copy is captured by Sanoid, so deleting it afterwards
# reclaims nothing for 14 days. Mount external media at this path before restoring.
# For a partial restore, prefer --include over a full one:
#   restic ... restore latest --target /mnt/restore --include /zpool/catallenya/radicale
RESTIC_RESTORE_TARGET=/mnt/restore
RESTIC_BACKUP_TARGETS="/zpool/catallenya/.claude \
/zpool/catallenya/archivebox \
/zpool/catallenya/caddy \
/zpool/catallenya/changedetection \
/zpool/catallenya/flame \
/zpool/catallenya/immich \
/zpool/catallenya/radicale \
/zpool/catallenya/sanoid \
/zpool/catallenya/syncthing/data \
/zpool/catallenya/memoka \
/zpool/catallenya/upvotes/dump \
/zpool/catallenya/systemd"
# Raw PostgreSQL/Redis data dirs are excluded — unsafe to copy while running.
# Memoka DB is backed up via pg_dump to memoka/backup/ before restic runs.
# Narrowed 2026-08-10 from the whole config dir to just index-v2. The comment
# above justifies these exclusions as "unsafe to copy while running", which is
# true of index-v2 (a LevelDB, and 213M of it) but NOT of the 36K beside it:
# config.xml holds every folder definition and device share, and key.pem/cert.pem
# ARE the Syncthing device identity. Excluding those meant a restore came back
# with a NEW device ID — every peer would have to re-accept the node and every
# folder be reconfigured by hand, on top of 567G of data that restored fine.
# index-v2 is fully regenerable: Syncthing rebuilds it by rescanning.
RESTIC_EXCLUDE_TARGETS="/zpool/catallenya/syncthing/data/config/index-v2 \
/zpool/catallenya/syncthing/data/config/syncthing.lock \
/zpool/catallenya/memoka/postgres \
/zpool/catallenya/memoka/redis"
RESTIC_PASSWORD_FILE=/zpool/catallenya/restic/restic.pwd
RESTIC_NUMBER_DAILY_TO_KEEP=5
RESTIC_NUMBER_WEEKLY_TO_KEEP=2
RESTIC_NUMBER_MONTHLY_TO_KEEP=3
RESTIC_NUMBER_YEARLY_TO_KEEP=1
