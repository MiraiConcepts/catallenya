# Class: scheduled — clock-driven jobs that DO WORK.
#
# Members: restic.backup, restic.forget, restic.check@{subset,data},
#          immich.fix-rotations, capture.sweep, pigeonhole.sweep, zpool.scrub
#
# This class SETS nothing, deliberately. Its members' timeouts span five minutes
# (a sweep) to twelve hours (a full read-data check), and a drop-in clobbers
# rather than defaults — setting a value here would silently overwrite each unit's
# considered one. What the class does instead is REQUIRE, enforced by install.sh
# before anything is linked:
#
#   TimeoutStartSec=            explicit and finite.
#
#       Three members ran at `infinity` (restic.forget and both check@ instances),
#       so a hung rclone or B2 connection would run forever while holding a
#       repository lock. Note that a HUNG run is never collected by the
#       `restic unlock` in each script either: restic refreshes its own lock every
#       5 minutes, so a live-but-stuck run never reaches the 30-minute staleness
#       threshold. The timeout is the only thing that ends it.
#
#   [X-Catallenya] MaxAge=      how long may pass before the watchdog complains.
#   [X-Catallenya] Freshness=   what to check.
#
#       This is the ONLY class where Freshness splits, which is why it is declared
#       rather than implied. restic.backup has a real downstream artifact — the
#       newest snapshot in the repository, which also proves credentials, network
#       and bucket in one call. restic.forget has no artifact at all and needs a
#       completion stamp. Prefer the artifact wherever one exists: it proves the
#       job's EFFECT, not merely that the job ran.
#
# NAMING TRAP: restic.check@subset and restic.check@data belong HERE, not in
# monitor. Despite the name they are heavy work — check@data holds an EXCLUSIVE
# repository lock for roughly 8h30m. Under monitor's 10-minute timeout systemd
# would kill the yearly integrity pass a few minutes in, every year, and the only
# symptom would be a failure notification nobody connects to the cause.
