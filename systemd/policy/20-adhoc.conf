# Class: adhoc — event-triggered. No schedule, so no cadence to be stale against.
#
# Members: capture.triage, pigeonhole.triage, pigeonhole.apply (all .path-driven),
#          catallenya (boot is an event too)
#
# A .path unit re-checks after its service exits and re-triggers while the
# condition still holds, so a job that fails to drain its input spins forever. For
# the two triage jobs, every spin is a paid API call.

[Unit]
# THIS IS THE FIX FOR THE CAPTURE HOT-LOOP, and it arrives by class membership
# rather than by anyone remembering.
#
# capture.triage was running on systemd's default 10s/5 while its own comment
# claimed a start limit protected it. One triage takes 10-20 seconds, so five
# starts inside a ten-second window is arithmetically impossible — the guard could
# never fire. The loop it could not catch is precisely the expensive one: an
# undrained PNG, one opus vision call per spin, indefinitely.
#
# pigeonhole.triage had already been widened to exactly these values for exactly
# this reason. Setting them at the class means no future event job can miss it.
#
# The window is WIDE on purpose. Two legitimate cases re-fire these units
# repeatedly — a drop larger than MAX_PER_RUN, drained one capped batch per run,
# and a Syncthing that stays busy. With a narrow window those look identical to a
# spin, and worse, a SLOW spin evades a narrow window entirely because starts
# three minutes apart never reach the burst. Thirty minutes and twelve starts
# catches the runaway while letting a 240-document import finish.
#
# Note the section: StartLimitIntervalSec= and StartLimitBurst= live in [Unit],
# not [Service]. Putting them in [Service] parses without complaint and does
# nothing.
StartLimitIntervalSec=1800
StartLimitBurst=12

# NOT set here, required by install.sh instead:
#   TimeoutStartSec=            15min for a capture triage, 30min for documents.
#   [X-Catallenya] Freshness=   the .path unit to check is armed, or the literal
#                               `boot` for catallenya.
#
# MaxAge= must NOT be declared for this class. There is no expected cadence to
# measure against: capture.triage legitimately ran on 12 of the last 60 days, and
# pigeonhole.apply on 4. Asking "when did this last run" is the wrong question —
# the right one is "is the watcher still armed", which is a now-question that
# per-boot state answers correctly.
