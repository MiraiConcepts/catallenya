# Base policy — applies to EVERY catallenya job.
#
# Linked into <unit>.service.d/ by systemd/install.sh. Never copy this file: the
# whole point is that one edit here changes every job at once.
#
# DROP-INS OUTRANK THE UNIT FILE. Verified on this box — a unit's RuntimeMaxSec=999
# lost to a drop-in's 111. So anything set here is FINAL: a job cannot override it
# by writing a different line in itself, only by a higher-numbered drop-in of its
# own. Put nothing here that a job might legitimately need to differ on.
#
# Deliberately NOT here:
#   User=            13 of 15 units use carrein, which makes it the most
#                    hoistable-looking directive in the repo and exactly the one
#                    that must not be. zpool.scrub and catallenya need root, both
#                    verified: `zpool scrub -p` as carrein returns permission
#                    denied (/dev/zfs is 0666 but the kernel enforces
#                    CAP_SYS_ADMIN, and there is no `zpool allow`), and
#                    catallenya.sh calls daemon-reload, systemctl start and
#                    runuser. Setting User= here would silently demote them.
#                    install.sh REQUIRES an explicit User= instead.
#   TimeoutStartSec= spans 5min to 12h across the classes. Required, never set.
#   RuntimeMaxSec=   systemd IGNORES it on Type=oneshot ("has no effect in
#                    combination with Type=oneshot") while `systemctl show` still
#                    reports it — a setting that looks applied and does nothing.
#                    Every job here is oneshot. Never use it; use TimeoutStartSec.

[Unit]
# %N is the unit name minus its suffix, and resolves for template instances too:
# restic.check@subset.service -> system-ntfy@restic.check@subset.service.
# This one line replaces a hand-written OnFailure= in 11 units and gives one to
# the three that never had it (disk, zpool.scrub, catallenya).
OnFailure=system-ntfy@%N.service

# Every job's scripts, state and data live on /zpool.
#
# Requires= rather than ConditionPathIsMountPoint=: a failed Condition is a SKIP,
# not a failure. No exit code, no OnFailure=, no journal error — the unit simply
# does not run while everything looks healthy. That is exactly how sanoid stopped
# taking snapshots silently after an apt upgrade, and why catallenya.service's own
# ConditionPathIsMountPoint=/zpool made a failed pool mount invisible.
#
# Safe as a hard dependency: zfs-mount.service is RemainAfterExit=yes and stays
# active(exited) after boot, so this is already satisfied and never re-triggers
# it. documents.sweep.service has required it daily for months.
Requires=zfs-mount.service
After=zfs-mount.service

[Service]
Type=oneshot
StandardOutput=journal
StandardError=journal
SyslogIdentifier=%N

# Hardening. Eight of fifteen units had NoNewPrivileges/PrivateTmp; the four
# restic units and zpool.scrub had no sandboxing whatsoever. This is their first.
#
# AmbientCapabilities survives NoNewPrivileges: the capability is granted by
# systemd before exec, and NNP only blocks privileges GAINED at exec (setuid bits,
# file capabilities). This matters because restic.backup's CAP_DAC_READ_SEARCH is
# load-bearing — 15 paths across the backup targets are unreadable by carrein
# (10 in changedetection, 3 in syncthing, 2 in memoka), and losing the capability
# would make restic silently skip them. Proven with a real backup before landing,
# never assumed.
NoNewPrivileges=true
PrivateTmp=true
RestrictRealtime=true
LockPersonality=true
SystemCallArchitectures=native
ProtectKernelModules=true

# ProtectClock= is DELIBERATELY ABSENT, and must not be added back.
#
# It implies `DeviceAllow=char-rtc r`, and per systemd.resource-control the
# default `DevicePolicy=auto` only allows all devices *while no explicit
# DeviceAllow= is present*. One implied entry collapses it to a closed allowlist
# of null/zero/full/random/urandom/ptys/rtc — and /dev/zfs (char 10:249) is not in
# it. Upstream hits this too: systemd-journald carries an explicit
# `DeviceAllow=char-* rw` to undo it, and zfs-zed.service ships ProtectClock=no.
#
# Measured on this box, isolating the single directive:
#   unit with ExecStart=/usr/sbin/zpool status  -> Result=success
#   same unit + ProtectClock=true               -> Result=exit-code
#
# Three jobs open /dev/zfs. zpool.scrub and disk would fail loudly, which is
# survivable. catallenya.heartbeat would fail SILENTLY: it runs without `set -e`
# and guards every branch, so it would report "no snapshots exist on zpool" and
# "no scan line" every single day — permanently, and indistinguishably from a
# genuinely stopped sanoid. The watchdog would become the thing it was built to
# detect.
#
# Nothing here sets the system clock, so the protection buys nothing against a
# threat that exists. If it is ever wanted, it needs `DeviceAllow=/dev/zfs rw` on
# every ZFS-touching job, not a line in the base.

# New files default to owner-only. Verified safe rather than assumed: every
# container that reads a file one of these jobs writes runs as uid 1000 (capture,
# immich-server) or root (syncthing), and the documents pipeline moves files with
# mv, which preserves the original mode.
UMask=0077

# --- Completion stamp ---
# systemd runs ExecStartPost ONLY when ExecStart succeeded — verified on this box:
# a unit with ExecStart=/bin/false leaves no stamp. That is exactly the semantic
# the watchdog needs, and getting it from systemd rather than from each script
# means no job can record a false success.
#
# It matters most for immich.fix-rotations.daily.sh, which deliberately runs
# `set -uo pipefail` WITHOUT -e so its own notify survives a failed bake, then
# propagates with `exit "${RC}"`. A stamp written by that script's last line would
# mark a failed bake healthy. Here the exit code decides, so it cannot.
#
# Note this is a COMPLETION record, not a trigger record — the distinction the
# whole watchdog rests on. systemd's own timestamps cannot serve: they are
# per-boot, and zpool.scrub.service reports Result=success with every timestamp
# empty because it last ran before the current boot.
#
# The `-` prefix is deliberate. Without it a failed touch would fail the UNIT,
# turning a successful backup into a failed one over a bookkeeping problem. With
# it, a stamp that cannot be written simply goes stale and the watchdog reports the
# job — which fails toward noticing rather than toward silence.
#
# %N covers template instances too: restic.check@subset.service stamps
# `restic.check@subset`, matching its Freshness= exactly.
ExecStartPost=-/usr/bin/touch /zpool/catallenya/systemd/state/%N

# Writable so the stamp above can be written. Every job already runs in a mount
# namespace because of PrivateTmp above, so this adds no new isolation machinery —
# it only punches the one hole the stamp needs through whatever sandbox a class or
# family imposes. Kept here rather than per-class so no future sandboxed job can
# forget it and silently look dead to the watchdog.
ReadWritePaths=/zpool/catallenya/systemd/state
