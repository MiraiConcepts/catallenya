# Base policy for every catallenya TIMER. Linked into <unit>.timer.d/.
#
# Timers get their own base file because .timer and .service accept different
# directives; one file cannot serve both.

[Timer]
# All 12 timers already set this identically, so hoisting it costs nothing and
# means a new timer cannot forget it. Without Persistent=, a run missed while the
# box was powered off simply never happens — and this host has no UPS and does
# not auto-power-on after an outage, so missed runs are a real scenario rather
# than a theoretical one.
#
# The cost of Persistent= is worth knowing when editing a schedule: it works by
# comparing the calendar against /var/lib/systemd/timers/stamp-<unit>.timer, so
# changing OnCalendar= such that an occurrence under the NEW rule falls after the
# stamp makes systemd believe it overslept and fire immediately on daemon-reload.
# That is how the 8h30m restic.check@data (since retired) launched unexpectedly
# on 2026-08-09.
Persistent=true

[Install]
WantedBy=timers.target

# NOT set here, required by install.sh instead:
#   OnCalendar=          obviously per-timer
#   RandomizedDelaySec=  every timer but disk.timer has one. Jitter matters
#                        because several of these contend for the same resources
#                        — the restic jobs share a repository lock, and an exact
#                        on-the-hour disk check lands alongside everything else
#                        scheduled on the hour.
