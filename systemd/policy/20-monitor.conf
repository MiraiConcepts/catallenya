# Class: monitor — clock-driven jobs that only LOOK and REPORT. They change nothing.
#
# Members: disk, restic.staleness, changedetection.health, catallenya.heartbeat
#
# Because they change nothing, they can be locked down uniformly and bounded
# tightly. That is also the fix for restic.staleness and changedetection.health
# having run with no time limit at all.

# NO `OnSuccess=` RESET HERE, because there is no such thing.
#
# An earlier version of this file carried `OnSuccess=` on the belief that an empty
# assignment resets the list. Measured on this box: it does not. A unit declaring
# `OnSuccess=zzmark.service` plus a drop-in with `OnSuccess=` still resolves to
# `OnSuccess=zzmark.service`, and the marker unit actually runs. The empty-reset
# documented in systemd.unit(5) covers Documentation= and Condition*=/Assert*=;
# for [Unit] DEPENDENCY lists it silently does nothing. ([Service] exec lists like
# Environment=, ReadWritePaths= and InaccessiblePaths= do reset correctly — the
# split is [Service] yes, [Unit] no.)
#
# So the rule "silence is the healthy state" cannot be enforced by inheritance and
# is enforced by install.sh instead, which REFUSES a monitor that declares
# OnSuccess=. A gate that rejects beats a drop-in that pretends.
#
# It matters more than it looks: 20-scheduled.conf warns that restic.check@ could
# be mis-filed into this class, and that unit declares
# `OnSuccess=system-ntfy@restic.check@%i.service`. A no-op reset would have left it
# in place while the comment claimed otherwise.

[Service]
# A monitor that hangs is worse than one that fails: it reports nothing, and
# nothing reports it. Ten minutes is far beyond any legitimate run — the slowest
# member is restic.staleness, which queries B2 and returns in seconds.
TimeoutStartSec=10min

# Read-only sandbox. A monitor that can write is a monitor that can damage what it
# is watching.
#
# Verified that ProtectSystem=strict does NOT block the docker socket, which
# changedetection.health needs for `docker exec`: connecting to a unix socket does
# not require the mount to be writable. Tested before this file was written, since
# it was the single most likely breakage in the whole refactor.
ProtectSystem=strict
ProtectHome=read-only
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true

# The stamp directory is deliberately NOT listed here. 10-base.conf grants it to
# every job, so a monitor inherits write access to it despite the strict sandbox
# above. Listing it again would work — ReadWritePaths accumulates across drop-ins —
# but would imply the base does not already handle it, and the next person would
# copy that assumption into a new class.

# NOT set here, required by install.sh instead:
#   [X-Catallenya] MaxAge=   per-monitor; disk runs hourly, the others daily.
#
# Freshness= is IMPLIED for this class and must not be declared: a monitor
# produces nothing but its own completion stamp, so there is never anything else
# to check.
