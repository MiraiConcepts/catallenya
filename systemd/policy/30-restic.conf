# Family: restic — every job that talks to the backup repository.
#
# Members: restic.backup, restic.forget, restic.check@{subset,data},
#          restic.staleness
#
# Orthogonal to class again: staleness is a monitor, the other three are
# scheduled. All four share the same remote and the same reachability
# requirement, which is what makes them a family.

[Unit]
# The repository lives in B2 behind rclone. A run that starts before the network
# is up fails at `lock repository`, and for backup that means a missed night that
# only restic.staleness would eventually notice.
Requires=network-online.target
After=network-online.target

[Service]
# Identical in all four units today. restic shells out to `rclone serve restic`,
# which reads its remote definition from here.
#
# Worth knowing: that rclone invocation carries --b2-hard-delete by default (the
# literal string is in the restic binary), which is why every delete restic makes
# is a real b2_delete_file_version rather than a hide, and why the bucket needs no
# lifecycle rule.
Environment="RCLONE_CONFIG=/zpool/catallenya/rclone/.rclone.conf"

# NOT set here:
#   AmbientCapabilities=  only restic.backup needs CAP_DAC_READ_SEARCH, and only
#                         it should have it. 15 paths across the backup targets
#                         are unreadable by carrein — 10 in changedetection, 3 in
#                         syncthing, 2 in memoka — so without the capability
#                         restic silently skips them. Giving it to all four would
#                         hand raw read of the whole pool to three jobs that only
#                         ever list snapshots.
#   The password file and repository location come from restic/restic.conf, which
#   each script sources itself.
