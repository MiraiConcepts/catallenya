# Family: intake — the capture, documents and liquidroom pipelines.
#
# Members: capture.triage, capture.sweep, documents.triage, documents.apply,
#          documents.sweep, liquidroom.triage
#
# Family is ORTHOGONAL to class, which is why it is a separate layer rather than a
# sub-branch: capture.sweep is scheduled and capture.triage is adhoc, and both
# belong here. Class is how a job is triggered; family is what it touches.
#
# These five units shared thirteen identical directives copy-pasted between them,
# including the three InaccessiblePaths lines below. That duplication is the
# largest in the repo and the clearest argument for this layer existing.

[Service]
Environment=PATH=/usr/local/bin:/usr/bin:/bin

# Sandbox. The two triage jobs hold ANTHROPIC_API_KEY in their environment.
# Requests carry no `tools` key, so the model has no tool surface and no path to
# the filesystem — this bounds the blast radius of a future edit that adds one.
#
# It does NOT make .env unreadable, and an earlier version of this comment in the
# unit files claimed otherwise. ProtectSystem=strict makes the tree read-only, not
# inaccessible, and .env is owned by the user these run as. What changed is that
# the scripts no longer source it wholesale.
#
# Verify the sandbox actually ENGAGED, rather than that the job merely succeeded:
#   sudo systemd-run --wait --pipe --uid=carrein \
#     --property=ProtectSystem=strict --property=ProtectHome=read-only \
#     --property=InaccessiblePaths=/zpool/catallenya/restic \
#     /bin/sh -c 'test -r /zpool/catallenya/restic/restic.pwd && echo FAIL || echo OK'
ProtectSystem=strict
ProtectHome=read-only
ProtectKernelTunables=true
ProtectControlGroups=true
RestrictSUIDSGID=true

# The three things an intake job must never reach: the backup repository password,
# the tunnel credentials, and the rclone remote config.
InaccessiblePaths=/zpool/catallenya/restic
InaccessiblePaths=/zpool/catallenya/cloudflared
InaccessiblePaths=/zpool/catallenya/rclone

# ReadWritePaths= is REQUIRED per job rather than set here, deliberately: capture
# writes only its spool, documents writes only the corpus and its own state, and
# neither should hold the other's. Collapsing them into one shared value would
# quietly widen both.
