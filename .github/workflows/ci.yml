# Checks AND publishing. The mirror job at the bottom pushes feature directories
# to standalone repos, which is why this is no longer only "CI".
name: Verify & Publish

on:
  push:
    branches: [ main ]  # Direct pushes (the normal flow).
  pull_request:         # Vets dependabot's action-bump PRs before merge.
  workflow_dispatch:    # Manual runs for testing.

permissions:
  contents: read  # Read-only token; no job needs write access.

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for secret scanning.

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the SCANNER, not just the action. The action SHA above only fixes the
          # wrapper; the gitleaks binary it downloads is whatever that release bundles,
          # so a dependabot SHA bump silently changes the scanner version. 8.30.1 does
          # not flag the same things 8.24.3 does, and .gitleaksignore fingerprints are
          # version-sensitive — a silent bump could mask a real finding or resurface a
          # suppressed false positive. Verify locally with the SAME version:
          #   docker run --rm -v "$PWD:/repo" -w /repo \
          #     zricethezav/gitleaks:v8.24.3 detect --redact
          GITLEAKS_VERSION: "8.24.3"

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check .env.ci covers every compose variable
        # `docker compose config` only warns (exit 0) when a var used in a
        # non-structural position is unset, so drift between docker-compose.yml
        # and .env.ci would otherwise pass silently.
        run: |
          # shellcheck disable=SC2016  # the ${...} in the grep pattern is a regex, not an expansion
          # Full-line comments are stripped first. Without that, prose DESCRIBING an
          # interpolation reads as one, and the guard demands a .env.ci entry for a
          # variable that does not exist — which is exactly how a comment about
          # interpolation failed this job on 2026-08-10. Comments are not config.
          # Note this strips whole-line comments only: a trailing `# ... ${VAR}` on a
          # real config line would still be counted, because stripping from the first
          # `#` would corrupt any value legitimately containing one.
          missing=$(comm -23 \
            <(grep -v '^[[:space:]]*#' docker-compose.yml | grep -oE '\$\{[A-Z_0-9]+\}' | tr -d '${}' | sort -u) \
            <(grep -v '^#' .env.ci | cut -d= -f1 | sort -u))
          if [ -n "$missing" ]; then
            echo "Variables used in docker-compose.yml but missing from .env.ci:"
            echo "$missing"
            exit 1
          fi

      - name: Validate compose file
        run: docker compose --env-file .env.ci config --quiet

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        # shellcheck is preinstalled on ubuntu-latest runners.
        # Gates on warning+error; info/style-level findings don't block.
        run: git ls-files -z '*.sh' | xargs -0 shellcheck -S warning

  # Publishes a feature directory to its own standalone repo, so a single feature
  # can be linked, described and pinned on its own — you cannot pin a directory.
  # The monorepo stays the source of truth and the sync is STRICTLY ONE-WAY: the
  # push is --force, so anything committed directly in a mirror is destroyed on
  # the next run. Mirrors are an output, never an input.
  #
  # This lives in the CI workflow rather than its own file for two reasons that
  # only get stronger as mirrors are added: `needs:` below is what guarantees a
  # mirror can never contain code that failed a check, and a separate workflow
  # would have to duplicate the notify-failure job to stay loud. Adding the next
  # mirror is one line in the matrix.
  mirror:
    runs-on: ubuntu-latest
    needs: [gitleaks, compose-validate, shellcheck]
    # Pushes to main only. A pull_request run must never publish unmerged code to
    # a public repo.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false # One broken mirror must not cancel the others.
      matrix:
        include:
          - { prefix: liquidroom, repo: MiraiConcepts/liquidroom, key: LIQUIDROOM_DEPLOY_KEY }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MANDATORY. `git subtree split` on the default shallow clone produces a
          # SINGLE commit without erroring — a mirror with no history that looks
          # perfectly fine until someone reads its git log.
          fetch-depth: 0

      - name: Skip when this prefix did not change
        id: gate
        # on.push.paths is workflow-level and so cannot discriminate between
        # matrix entries; the filter has to live here to be per-mirror.
        # workflow_dispatch has no HEAD^ to diff against, and the very first run
        # arrives with the workflow edit itself — which touches .github, not any
        # mirrored prefix — so a manual run must always proceed.
        run: |
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] \
             && git diff --quiet HEAD^ HEAD -- "${{ matrix.prefix }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Split and push
        if: steps.gate.outputs.skip != 'true'
        env:
          # A deploy key, not a PAT: fine-grained PATs only reach an organisation
          # that has explicitly enabled them, and deploy keys never expire.
          DEPLOY_KEY: ${{ secrets[matrix.key] }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Deterministic: same history in, same commit SHAs out, so re-running
          # regenerates the identical old commits plus the new ones.
          git subtree split --prefix="${{ matrix.prefix }}" -b mirror
          git push --force "git@github.com:${{ matrix.repo }}.git" mirror:main

  notify-failure:
    runs-on: ubuntu-latest
    # `mirror` is here deliberately: a mirror that silently stops syncing looks
    # identical to one that is current, which is the exact failure mode the rest
    # of this repo exists to prevent.
    needs: [gitleaks, compose-validate, shellcheck, mirror]
    if: failure()
    steps:
      - name: Post failure to ntfy
        env:
          NTFY_URL: ${{ secrets.NTFY_FAILURE_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "NTFY_FAILURE_URL secret not set; skipping notification."
            exit 0
          fi
          curl -sf \
            -H "Title: CI failed: $REPO" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -d "A CI job failed on $REF. $RUN_URL" \
            "$NTFY_URL"
