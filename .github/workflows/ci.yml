# Checks AND publishing. The mirror job at the bottom pushes feature directories
# to standalone repos, which is why this is no longer only "CI".
name: Verify & Publish

on:
  push:
    branches: [ main ]  # Direct pushes (the normal flow).
  pull_request:         # Vets dependabot's action-bump PRs before merge.
  workflow_dispatch:    # Manual runs for testing.

permissions:
  contents: read  # Read-only token; no job needs write access.

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Full history for secret scanning.

      - name: Run GitLeaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pin the SCANNER, not just the action. The action SHA above only fixes the
          # wrapper; the gitleaks binary it downloads is whatever that release bundles,
          # so a dependabot SHA bump silently changes the scanner version. 8.30.1 does
          # not flag the same things 8.24.3 does, and .gitleaksignore fingerprints are
          # version-sensitive — a silent bump could mask a real finding or resurface a
          # suppressed false positive. Verify locally with the SAME version:
          #   docker run --rm -v "$PWD:/repo" -w /repo \
          #     zricethezav/gitleaks:v8.24.3 detect --redact
          GITLEAKS_VERSION: "8.24.3"

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check .env.ci covers every compose variable
        # `docker compose config` only warns (exit 0) when a var used in a
        # non-structural position is unset, so drift between docker-compose.yml
        # and .env.ci would otherwise pass silently.
        run: |
          # shellcheck disable=SC2016  # the ${...} in the grep pattern is a regex, not an expansion
          # Full-line comments are stripped first. Without that, prose DESCRIBING an
          # interpolation reads as one, and the guard demands a .env.ci entry for a
          # variable that does not exist — which is exactly how a comment about
          # interpolation failed this job on 2026-08-10. Comments are not config.
          # Note this strips whole-line comments only: a trailing `# ... ${VAR}` on a
          # real config line would still be counted, because stripping from the first
          # `#` would corrupt any value legitimately containing one.
          missing=$(comm -23 \
            <(grep -v '^[[:space:]]*#' docker-compose.yml | grep -oE '\$\{[A-Z_0-9]+\}' | tr -d '${}' | sort -u) \
            <(grep -v '^#' .env.ci | cut -d= -f1 | sort -u))
          if [ -n "$missing" ]; then
            echo "Variables used in docker-compose.yml but missing from .env.ci:"
            echo "$missing"
            exit 1
          fi

      - name: Validate compose file
        run: docker compose --env-file .env.ci config --quiet

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        # The check itself lives in ci/shellcheck.sh, which is also what the
        # ci/pre-push hook runs — one definition, so the local run and this job
        # cannot disagree about version, severity or which files are in scope.
        # Do NOT inline the command back here: this job used the runner's
        # PREINSTALLED shellcheck until 2026-08-22, and an unnamed version is one
        # nothing can be matched against. Measured that day, the ubuntu-24.04
        # runner ships 0.9.0 while `:stable` and `:latest` are both 0.11.0 — so CI
        # ran two releases BEHIND any local check and raised an SC2218 false
        # positive 0.11.0 had already fixed. The pin and the reasoning are in the
        # script; changing either is one edit that moves both callers together.
        run: bash ci/shellcheck.sh

  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate the job contract
        # The gate every unit must satisfy, run here for the first time on
        # 2026-08-23. It had existed for weeks and run ONLY when a human typed it:
        # CLAUDE.md documented `bash systemd/install.sh --check` as "run this
        # before committing any unit change", which is discipline, not a gate.
        # That failed on the first unit change after the rule was written —
        # commit 32e92f6 dropped a required RandomizedDelaySec= and pushed GREEN,
        # because audit/pre-commit frisks for secrets, ci/pre-push ran shellcheck,
        # and nothing anywhere read a unit file. A refused unit on main is one
        # `sudo bash systemd/install.sh` away from aborting the whole install,
        # since the gate creates NO links if any single unit fails.
        #
        # Same file the ci/pre-push hook runs. Do NOT inline it — that is the
        # drift shellcheck.sh was extracted to prevent.
        run: bash ci/contract.sh

      # systemd/tests/run.sh IS NOT RUN HERE, and it was tried. It is the 101-case
      # suite that proves the gate still refuses each forbidden shape — genuinely
      # worth having, and it fails on a runner for a reason that is not a defect:
      # it executes the REAL scripts, and those resolve /zpool/catallenya
      # absolutely and on purpose. systemd/heartbeat.sh sources the transport by
      # absolute path with a comment saying why; ntfy/system-ntfy.sh reads the root
      # .env the same way. Seven cases failed on paths that cannot exist here.
      #
      # Making it portable means changing how production scripts resolve their own
      # paths, to satisfy a test runner. That is a real risk taken for a
      # second-order check, so it is not taken. THE GATE IS THE CHECK — it catches
      # the violation, and it runs everywhere. The suite catches a BROKEN gate,
      # which is a rarer failure and one a human running the documented
      # `bash systemd/tests/run.sh` will find.

  # Publishes a feature directory to its own standalone repo, so a single feature
  # can be linked, described and pinned on its own — you cannot pin a directory.
  # The monorepo stays the source of truth and the sync is STRICTLY ONE-WAY: the
  # push is --force, so anything committed directly in a mirror is destroyed on
  # the next run. Mirrors are an output, never an input.
  #
  # This lives in the CI workflow rather than its own file for two reasons that
  # only get stronger as mirrors are added: `needs:` below is what guarantees a
  # mirror can never contain code that failed a check, and a separate workflow
  # would have to duplicate the notify-failure job to stay loud. Adding the next
  # mirror is one line in the matrix.
  mirror:
    runs-on: ubuntu-latest
    needs: [gitleaks, compose-validate, shellcheck, contract]
    # Pushes to main only. A pull_request run must never publish unmerged code to
    # a public repo.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false # One broken mirror must not cancel the others.
      matrix:
        include:
          # `prefix` is the DIRECTORY, `repo` is its published name. Three of the six
          # match; systemd -> controlplane, ai -> inference and ntfy -> dispatch do
          # not, deliberately —
          # renaming a directory to match would reset the mirror's history the way
          # capture->afterimage and documents->pigeonhole reset theirs.
          - { prefix: liquidroom, repo: MiraiConcepts/liquidroom, key: LIQUIDROOM_DEPLOY_KEY }
          - { prefix: afterimage, repo: MiraiConcepts/afterimage, key: AFTERIMAGE_DEPLOY_KEY }
          - { prefix: pigeonhole, repo: MiraiConcepts/pigeonhole, key: PIGEONHOLE_DEPLOY_KEY }
          # These two prefixes are not features. systemd/ publishes the job contract
          # itself, and its install.sh and tests reach across the parent repo by
          # design, which the mirror's README states rather than pretends otherwise.
          - { prefix: systemd,    repo: MiraiConcepts/controlplane, key: CONTROLPLANE_DEPLOY_KEY }
          # ai/ publishes the shared AI layer — the one library allowed to talk to
          # the Anthropic API. Its consumers live in the parent repo too; the
          # mirror's README says so and links the two that are themselves mirrored.
          - { prefix: ai,         repo: MiraiConcepts/inference,    key: INFERENCE_DEPLOY_KEY }
          # ntfy/ publishes the message layer — the contract, the constructors, the
          # body renderers and the courier. Its directory keeps the name three
          # consumers source it by; the repo cannot, because MiraiConcepts/ntfy would
          # read as a fork of binwiederhier/ntfy rather than as a grammar for it.
          - { prefix: ntfy,       repo: MiraiConcepts/dispatch,     key: DISPATCH_DEPLOY_KEY }
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # MANDATORY. `git subtree split` on the default shallow clone produces a
          # SINGLE commit without erroring — a mirror with no history that looks
          # perfectly fine until someone reads its git log.
          fetch-depth: 0

      - name: Skip when this prefix did not change
        id: gate
        env:
          BASE: ${{ github.event.before }}
        # on.push.paths is workflow-level and so cannot discriminate between
        # matrix entries; the filter has to live here to be per-mirror.
        #
        # Compare against the push's TRUE base, never HEAD^. A push carrying three
        # commits where only the FIRST touched this prefix diffs clean against
        # HEAD^ and skips — silently, with every job green — leaving the mirror
        # stale until something unrelated happens to touch the prefix again. That
        # is not hypothetical: it ate the liquidroom docs and then the capture and
        # documents ones, both on 2026-08-15, within hours of the job shipping.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual run: always proceed"
          elif [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            # First push to the branch, or a base that a force-push rewrote away.
            # Proceed deliberately: a needless sync force-pushes byte-identical
            # content and costs nothing, while a wrong skip leaves a public mirror
            # quietly out of date and reports success doing it. Fail toward noticing.
            echo "base unknown ($BASE): proceeding rather than risk a silent skip"
          elif git diff --quiet "$BASE" HEAD -- "${{ matrix.prefix }}"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Split and push
        if: steps.gate.outputs.skip != 'true'
        env:
          # A deploy key, not a PAT: fine-grained PATs only reach an organisation
          # that has explicitly enabled them, and deploy keys never expire.
          DEPLOY_KEY: ${{ secrets[matrix.key] }}
        run: |
          # Say WHICH of the two setup halves is missing. Without this, an absent
          # secret writes an empty key file and the only symptom is ssh's
          # "error in libcrypto" followed by "Permission denied (publickey)" —
          # which reads as a rejected key rather than an absent one, and sends you
          # looking at the deploy key's write bit instead of at the secret.
          if [ -z "${DEPLOY_KEY:-}" ]; then
            echo "::error::Secret ${{ matrix.key }} is empty or unset in this repo."
            echo "Add the PRIVATE half of the deploy key as an Actions secret named ${{ matrix.key }}."
            exit 1
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Prove the key parses before blaming the remote. A mangled paste (lost
          # line breaks, missing trailing newline) fails here with a clear message
          # instead of surfacing as an authentication failure at push time.
          if ! ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null 2>&1; then
            echo "::error::Secret ${{ matrix.key }} is not a valid OpenSSH private key."
            echo "Re-add it without pasting:  gh secret set ${{ matrix.key }} --repo ${{ github.repository }} < /path/to/keyfile"
            exit 1
          fi
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Deterministic: same history in, same commit SHAs out, so re-running
          # regenerates the identical old commits plus the new ones.
          git subtree split --prefix="${{ matrix.prefix }}" -b mirror
          git push --force "git@github.com:${{ matrix.repo }}.git" mirror:main

  notify-failure:
    runs-on: ubuntu-latest
    # `mirror` is here deliberately: a mirror that silently stops syncing looks
    # identical to one that is current, which is the exact failure mode the rest
    # of this repo exists to prevent.
    needs: [gitleaks, compose-validate, shellcheck, contract, mirror]
    if: failure()
    steps:
      - name: Post failure to ntfy
        # THE ONE EMITTER THAT CANNOT SOURCE ntfy/kinds.sh, and therefore the one
        # that matches the message contract BY HAND. A runner has no access to this
        # box's transport, and the message goes to the public ntfy.sh rather than to
        # the tailnet instance — so this is a deliberate exception in the same class
        # as ntfy/system-ntfy.sh, which also builds its headers by hand because the
        # alarm of last resort must depend on nothing. See ntfy/MESSAGES.md.
        #
        # It was NOT matching until 2026-08-23. It carried `Priority: high` and
        # `Tags: rotating_light` — both removed from notify() repo-wide on
        # 2026-08-20, when priority became unrepresentable rather than merely
        # discouraged and twelve tag glyphs went with it — plus a hand-written
        # `CI failed: <repo>` title. It escaped every gate because systemd/contract.sh
        # scans tracked SHELL, and this is YAML. There is now a rule for that too.
        env:
          NTFY_URL: ${{ secrets.NTFY_FAILURE_URL }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$NTFY_URL" ]; then
            echo "NTFY_FAILURE_URL secret not set; skipping notification."
            exit 0
          fi
          # title_state's shape, written out: "<Subject>: <State>", subject
          # narrower than the topic. The topic is a generic failure channel, so
          # the repo is the subject; ${REPO##*/} drops the owner, which the topic
          # does not need and a lock screen has no room for.
          #
          # The body follows the renderers in ntfy/kinds.sh: a U+2022 fact that
          # reads as a complete statement and carries no stub label, then prose,
          # separated by a blank line, with a full stop on the prose line only.
          # The bare URL is deliberate and permitted — link SYNTAX is what hides a
          # destination inside a trusted message, and a bare URL shows where it goes.
          #
          # --data-raw, not -d: -d treats a leading @ as a filename to read.
          # --max-time, so a wedged ntfy.sh cannot hang the job that reports a
          # failure. No Priority and no Tags: nothing in this system shouts.
          curl -fsS --max-time 15 \
            -H "Title: ${REPO##*/}: CI Failed" \
            -H "Markdown: yes" \
            --data-raw "$(printf '\u2022 Failed on branch %s\n\n%s' "$REF" "$RUN_URL")" \
            "$NTFY_URL"
